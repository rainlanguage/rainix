name: rainix-sol-static
on:
  workflow_call:
env:
  RAINIX_SHA: 8657b83b68f41957ab85da91132c3f652c1f32c0
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      # Shared nix + cachix CI preamble (checkout, nix-quick-install, Cachix,
      # cache-nix-action) — pinned action SHAs live in the composite. Fully
      # qualified ref: a bare `./` would resolve against the calling repo.
      - uses: rainlanguage/rainix/.github/actions/nix-cachix-setup@main
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Ignored tests are banned org-wide with no exceptions: Rust #[ignore],
      # JS .skip/.only, Solidity xtest renames and any vm.skip. A test either
      # runs and passes or is deleted.
      - uses: rainlanguage/rainix/.github/actions/no-ignored-tests@main
      # Git submodules are banned org-wide — deps come from soldeer/npm/nix.
      - uses: rainlanguage/rainix/.github/actions/no-submodules@main
      # Agent context loaded at session START is capped org-wide: CLAUDE.md
      # plus its @path imports plus unscoped .claude/rules/**.md are in the
      # window on every turn, so their size taxes all work done in the repo.
      # Capping one file alone just moves the text sideways, so the cap is on
      # the total. Floor-only ratchet — an over-cap repo cuts its context (or
      # scopes a rule with `paths:`), it never raises the number.
      - uses: rainlanguage/rainix/.github/actions/agent-context-cap@main
      # Per-tag deploy-pin snapshots under src/generated/<tag>/ are append-only:
      # a release ADDS a new tag, never edits/deletes a frozen snapshot whose
      # address/codehash constants downstream consumers pin. No-op when absent.
      - uses: rainlanguage/rainix/.github/actions/frozen-snapshots-append-only@main
      # audit/mutation-test-scans.json is appended by hand and read as evidence
      # by the audit skill's gate and by rain-org-health's scanner, neither of
      # which validates it — so a short, mistyped or rebased-away SHA merges
      # green and mis-bases the next audit. Shape plus ancestry against HEAD.
      # No-op when absent.
      - uses: rainlanguage/rainix/.github/actions/mutation-ledger@main
      # Custom NatSpec tags (@custom:) are banned org-wide — document behavior
      # in standard NatSpec. Sole exception: ERC-7201's normative
      # `@custom:storage-location erc7201:` annotation, which tooling reads.
      - uses: rainlanguage/rainix/.github/actions/no-custom-natspec@main
      # Comment lines may not outnumber code lines in any tracked file under
      # src/ and test/: a file that is mostly prose is prose in the wrong
      # place. Per file, strict, both counts printed per offender.
      - uses: rainlanguage/rainix/.github/actions/comment-loc-cap@main
      # This job caches no `cache`/`out`, unlike every other sol workflow.
      # Restoring would be pointless: `slither .` shells out to `forge clean`
      # before its own build, so whatever was restored is deleted unused.
      # Saving is worse. Slither builds `--skip ./test/** ./script/**`, then
      # `forge lint` compiles the skipped files for their ASTs and writes
      # artifacts holding only `abi` and `id` — no bytecode — while recording
      # them in `cache/solidity-files-cache.json` as compiled; the dirty check
      # asks whether the artifact file exists, not whether it has bytecode.
      # `foundry-full-` is ONE namespace shared by every sol workflow through
      # its restore-keys prefix, so a save from here lands in rainix-sol-test,
      # which is then told "No files changed, compilation skipped" and reverts
      # every `vm.getCode` against a test/ or script/ contract with `no
      # bytecode for contract`. Only a full `forge build` may write that key.
      - name: Install soldeer dependencies
        if: hashFiles('soldeer.lock') != ''
        run: nix develop github:rainlanguage/rainix/${{ env.RAINIX_SHA }}#sol-shell -c forge soldeer install
      - run: nix develop github:rainlanguage/rainix/${{ env.RAINIX_SHA }}#sol-shell -c slither .
      - run: nix develop github:rainlanguage/rainix/${{ env.RAINIX_SHA }}#sol-shell -c forge fmt --check
      # forge's own linter. `forge lint` alone ALWAYS exits 0 — it prints its
      # findings and succeeds — so `-D warnings` is the gate, not the
      # subcommand. A finding that is deliberate (the flagged construct IS what
      # a test asserts) takes a scoped `// forge-lint: disable-next-line(<id>)`
      # plus the line saying why; it is never silenced wholesale.
      #
      # `-D` is a compiler flag, so it denies solc's own diagnostics too, but
      # only when solc actually runs: `slither .` has already compiled `src/`
      # in this job, so only the files it skipped (test/, script/) reach solc
      # here. Forge-lint findings are re-derived from source every run, so the
      # half this step exists for holds either way. `--force` would make the
      # solc half deterministic at the price of a second full rebuild in this
      # job; denying solc diagnostics org-wide is a bigger policy than this
      # step and belongs to whatever owns `forge build`.
      - run: nix develop github:rainlanguage/rainix/${{ env.RAINIX_SHA }}#sol-shell -c forge lint -D warnings
      # The devShell generates `.pre-commit-config.yaml` and installs it, so a
      # repo whose CI never runs it drifts from what its own hooks write, and
      # the drift then ships inside the next unrelated commit made from the
      # shell, burying that commit's real change in review noise.
      #
      # Reuses sol-shell, so prettier-rainix (which needs the default shell's
      # RAINIX_PRETTIER_BUNDLE_DIR) no-ops here: markdown, nix, toml, yaml and
      # shell are gated, JSON is not.
      - run: nix develop github:rainlanguage/rainix/${{ env.RAINIX_SHA }}#sol-shell -c pre-commit run --all-files --show-diff-on-failure --color always
      # Enforce Rain's one-contract-per-.sol-file convention (rainix#214).
      - run: nix develop github:rainlanguage/rainix/${{ env.RAINIX_SHA }}#sol-shell -c rainix-sol-single-contract
