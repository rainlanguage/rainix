name: rainix-sol
on:
  workflow_call:
    inputs:
      paid-fork-rpc-networks:
        description: >-
          Networks whose RPC_URL_<NETWORK>_FORK secret is passed on every run,
          branches and pull requests included, as a space-separated list of
          preflight keys (for example `bsc`). For a fork suite that needs a call
          no public endpoint serves, such as eth_getLogs at an old BSC block.
          Every other network uses the paid secret only on the default branch,
          tags, schedules and dispatches.
        type: string
        required: false
        default: ''
    secrets:
      PRIVATE_KEY:
        required: false
      EXPLORER_VERIFICATION_KEY:
        required: false
      RPC_URL_ARBITRUM_FORK:
        required: false
      RPC_URL_BASE_FORK:
        required: false
      RPC_URL_BASE_SEPOLIA_FORK:
        required: false
      RPC_URL_ETHEREUM_FORK:
        required: false
      RPC_URL_FLARE_FORK:
        required: false
      RPC_URL_HYPEREVM_FORK:
        required: false
      RPC_URL_POLYGON_FORK:
        required: false
      RPC_URL_ROBINHOOD_FORK:
        required: false
      RPC_URL_BSC_FORK:
        required: false
      RPC_URL_SEPOLIA_FORK:
        required: false
jobs:
  static:
    uses: ./.github/workflows/rainix-sol-static.yaml
  legal:
    uses: ./.github/workflows/rainix-sol-legal.yaml
  test:
    uses: ./.github/workflows/rainix-sol-test.yaml
    with:
      paid-fork-rpc-networks: ${{ inputs.paid-fork-rpc-networks }}
    secrets:
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      EXPLORER_VERIFICATION_KEY: ${{ secrets.EXPLORER_VERIFICATION_KEY }}
      RPC_URL_ARBITRUM_FORK: ${{ secrets.RPC_URL_ARBITRUM_FORK }}
      RPC_URL_BASE_FORK: ${{ secrets.RPC_URL_BASE_FORK }}
      RPC_URL_BASE_SEPOLIA_FORK: ${{ secrets.RPC_URL_BASE_SEPOLIA_FORK }}
      RPC_URL_ETHEREUM_FORK: ${{ secrets.RPC_URL_ETHEREUM_FORK }}
      RPC_URL_FLARE_FORK: ${{ secrets.RPC_URL_FLARE_FORK }}
      RPC_URL_HYPEREVM_FORK: ${{ secrets.RPC_URL_HYPEREVM_FORK }}
      RPC_URL_POLYGON_FORK: ${{ secrets.RPC_URL_POLYGON_FORK }}
      RPC_URL_ROBINHOOD_FORK: ${{ secrets.RPC_URL_ROBINHOOD_FORK }}
      RPC_URL_BSC_FORK: ${{ secrets.RPC_URL_BSC_FORK }}
      RPC_URL_SEPOLIA_FORK: ${{ secrets.RPC_URL_SEPOLIA_FORK }}
