name: rainix-autopublish
on:
  workflow_call:
    inputs:
      crate:
        description: single cargo package name to publish. Back-compat alias for a one-element `crates`.
        required: false
        type: string
        default: ''
      crates:
        description: >-
          Space-separated cargo package names in DEPENDENCY ORDER (dependencies first), e.g. "wasm-bindgen-utils-macros wasm-bindgen-utils". Used as the publish order and the set of crates the change-gate inspects. For a single crate this is just one name (or use `crate`). The workspace releases as a unit: if ANY listed crate's content changed, all are bumped in one `cargo release` commit and published in order — one commit, one push, no chained-job conflicts.
        required: false
        type: string
        default: ''
      level:
        description: cargo-release level for the bump (default patch).
        required: false
        type: string
        default: patch
      npm-package:
        description: >-
          optional npm package name (e.g. @rainlanguage/float). When set, the workflow also detects/bumps/publishes an npm package alongside the crate(s). Publishing authenticates via npm OIDC trusted publishing (the mechanism raindex already uses), NOT a long-lived token, which requires per caller: (1) the caller's job that `uses:` this workflow must grant `permissions: {id-token: write, contents: write}` — a called workflow can only downgrade the caller's token, never elevate it, so this workflow's own permission block is not enough on its own; (2) the package's settings on npmjs.com must carry a GitHub Actions Trusted Publisher entry naming the CALLER's org/repo and the CALLER's workflow FILENAME (npm validates the top-level workflow of the run, not this reusable file); (3) the package.json `repository.url` must match the caller repo — provenance is generated automatically and mismatches 422. Only the FIRST-EVER publish of a package still uses NPM_PUBLISH_PRIVATE_TOKEN, because npmjs.com only lets a Trusted Publisher be configured on a package that already exists.
        required: false
        type: string
        default: ''
      soldeer-package:
        description: >-
          optional Soldeer registry package name (e.g. rain-erc). When set, the workflow publishes on a content change vs the newest published revision. The registry is the version ledger and git tags carry version intent: the publish version is `max(patch_bump(newest published), newest next-v<x.y.z> tag merged into the pushed head)` under semver ordering — push a `next-v<x.y.z>` tag for a deliberate minor/major jump; consumed or stale intent tags are inert under the max. First publish (no revisions on the registry yet) REQUIRES a next-v tag as the explicit version seed. foundry.toml carries NO release metadata: it is never read for a version and never rewritten, and an `[external.package]` / legacy `[package]` section still present in a consumer is simply ignored (excluded from the content hash), so deleting it is content-neutral. The workflow NEVER commits or pushes to the consumer branch: the `sol-v<version>` tag + GitHub release are pushed as a tag ref, independent of any branch push — publishing works unchanged on branch-protected mains. A version's deploy-pin snapshot is built and committed by the PR that defines that version's content (main snapshots are frozen constants consumers pin against).
        required: false
        type: string
        default: ''
      soldeer-generate-cmd:
        description: >-
          DEPRECATED / no-op. Publishing does not generate per-release artifacts — a version's deploy-pin snapshot is built and committed by the PR that defines that version's content, never generated onto main by this workflow. Retained only so existing callers that still pass it do not error; it is ignored and will be removed. Consumers should drop it (and instead build snapshots in the PR, e.g. a pre-commit hook or a CI regenerate-and-verify check).
        required: false
        type: string
        default: ''
    secrets:
      PUBLISH_PRIVATE_KEY:
        required: false
      CI_GIT_EMAIL:
        required: false
      CI_GIT_USER:
        required: false
      CARGO_REGISTRY_TOKEN:
        required: false
      NPM_PUBLISH_PRIVATE_TOKEN:
        required: false
      SOLDEER_API_TOKEN:
        required: false
env:
  RAINIX_SHA: 60ba051bae06c184670289de32653f175a64dfaf
jobs:
  release:
    if: ${{ !startsWith(github.event.head_commit.message, 'Package Release') }}
    runs-on: ubuntu-latest
    # Serialize publish runs per caller repo + ref + soldeer package: without
    # this, near-simultaneous pushes both derive the same registry version and
    # the loser dies on Soldeer's duplicate rejection (harmless — no branch
    # writes — but a red run). Job-level concurrency inside a called workflow
    # is honored by GitHub (workflow-level would be ignored), so this covers
    # consumers whose caller has no concurrency group of its own; callers that
    # do carry one (e.g. a `package-release-<ref>` group) just serialize twice
    # under distinct group names, which composes safely.
    # cancel-in-progress false: a running publish is never killed mid-flight;
    # a superseded PENDING job is replaced by the newest queued one, whose
    # checkout contains everything the superseded push contained.
    concurrency:
      group: rainix-autopublish-${{ github.repository }}-${{ github.ref }}-${{ inputs.soldeer-package }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: write
      # The commit-CI gate reads this repository's workflow runs. A caller
      # job with an explicit `permissions:` block on its `uses:` job must
      # include `actions: read` there; a caller with no block needs nothing.
      actions: read
    steps:
      # This job needs a deploy-key (ssh-key) checkout, so it runs the shared
      # `checkout` composite itself with the key, then calls the nix+cachix
      # preamble with `checkout: 'false'`. The pinned checkout / cache-nix /
      # nix-quick-install / Cachix SHAs all live once in the composites. Fully
      # qualified ref: a bare `./` would resolve against the calling repo.
      - uses: rainlanguage/rainix/.github/actions/checkout@main
        with:
          # PUBLISH_PRIVATE_KEY is a deploy key whose push events trigger
          # downstream workflows (unlike GITHUB_TOKEN pushes which don't).
          # If the consumer hasn't set it, ssh-key is empty and checkout
          # falls back to GITHUB_TOKEN over HTTPS — pushes still succeed,
          # they just won't trigger tag-listening workflows.
          ssh-key: ${{ secrets.PUBLISH_PRIVATE_KEY }}
          # Full history + tags: the soldeer gate derives version intent from
          # next-v tags merged into the pushed head (`git tag --merged HEAD`),
          # which needs the tags AND the ancestry to judge reachability. The
          # gate refuses to run on a shallow checkout rather than silently
          # missing an intent tag.
          fetch-depth: '0'
      - uses: rainlanguage/rainix/.github/actions/nix-cachix-setup@main
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          checkout: 'false'
      # Resolve the crate list once (crates, else the back-compat singular crate).
      - name: Resolve crates
        run: |
          CRATES="${{ inputs.crates != '' && inputs.crates || inputs.crate }}"
          # A crate is required only when nothing else is being published; npm-
          # and soldeer-only callers legitimately have no crate.
          if [ -z "$CRATES" ] && [ -z "${{ inputs.npm-package }}" ] && [ -z "${{ inputs.soldeer-package }}" ]; then
            echo "set inputs.crate/crates, or inputs.npm-package, or inputs.soldeer-package" >&2
            exit 1
          fi
          echo "CRATES=$CRATES" >> "$GITHUB_ENV"
      - name: Git config
        run: |
          git config --global user.email "${{ secrets.CI_GIT_EMAIL || 'github-actions[bot]@users.noreply.github.com' }}"
          git config --global user.name "${{ secrets.CI_GIT_USER || 'github-actions[bot]' }}"
          # Entering the rainix devShell writes a generated .pre-commit-config.yaml
          # into the tree. cargo-release refuses to run with any uncommitted change
          # (including untracked files), so hide it from git via the local exclude
          # — repo-agnostic, no consumer needs to remember to .gitignore it.
          echo ".pre-commit-config.yaml" >> .git/info/exclude
      # Cargo change gate. Compare the *normalized content* of each packaged
      # crate against its published release — never raw file lists or tarball
      # hashes (the published .crate prefixes paths with "<name>-<version>/" and
      # adds generated files, so a naive comparison never matches and the crate
      # re-bumps every run). Strip the version prefix, drop generated/volatile
      # files, blank the version line, hash the sorted (path, content) stream.
      # crates.io 403s default curl UAs, so send a descriptive User-Agent and
      # distinguish a real 404 (never published) from other errors. The
      # workspace releases as a unit: changed=true if ANY listed crate differs.
      - name: Cargo hashes
        id: cargo
        if: ${{ inputs.crates != '' || inputs.crate != '' }}
        run: |
          set -euo pipefail
          UA="rainix-autopublish (+https://github.com/rainlanguage/rainix)"

          norm_hash() {
            local f="$1" d root
            d=$(mktemp -d)
            tar -xzf "$f" -C "$d"
            root=$(find "$d" -mindepth 1 -maxdepth 1 -type d)
            rm -f "$root/.cargo_vcs_info.json" "$root/Cargo.toml.orig" "$root/Cargo.lock"
            sed -i -E 's/^version = .*/version = "0.0.0"/' "$root/Cargo.toml"
            ( cd "$root" && find . -type f | LC_ALL=C sort \
                | while IFS= read -r p; do printf '%s\0' "$p"; cat "$p"; done \
                | sha256sum | cut -d' ' -f1 )
            rm -rf "$d"
          }

          changed=false
          for CRATE in $CRATES; do
            # cargo package resolves deps against the registry. For a first
            # interdependent workspace publish, a dependent (e.g. a lib that
            # pins its sibling proc-macro at the new version) can't be packaged
            # until that sibling is published — chicken-and-egg. If packaging
            # fails, treat the crate as changed and let the dependency-ordered
            # publish step sort it out (the sibling publishes first).
            if ! nix develop github:rainlanguage/rainix/${{ env.RAINIX_SHA }}#rust-shell -c cargo package -p "$CRATE" --allow-dirty --no-verify --quiet; then
              echo "gate $CRATE: cannot package yet (likely an unpublished intra-workspace dep) -> changed"
              changed=true
              continue
            fi
            LOCAL_CRATE=$(ls -t target/package/"$CRATE"-*.crate | head -1)
            NEW=$(norm_hash "$LOCAL_CRATE")
            resp=$(curl -sS -H "User-Agent: $UA" -w $'\n%{http_code}' "https://crates.io/api/v1/crates/$CRATE")
            http=$(printf '%s' "$resp" | tail -n1)
            body=$(printf '%s' "$resp" | sed '$d')
            if [ "$http" = "404" ]; then
              OLD="none"
            elif [ "$http" = "200" ]; then
              OLD_VERSION=$(printf '%s' "$body" | python3 -c "import sys, json; print(json.load(sys.stdin)['crate']['max_version'])")
              curl -fsSL -H "User-Agent: $UA" "https://crates.io/api/v1/crates/$CRATE/$OLD_VERSION/download" -o /tmp/old.crate
              OLD=$(norm_hash /tmp/old.crate)
            else
              echo "crates.io API returned HTTP $http for $CRATE" >&2
              exit 1
            fi
            echo "gate $CRATE: OLD=$OLD NEW=$NEW"
            if [ "$OLD" != "$NEW" ]; then changed=true; fi
          done
          echo "changed=$changed" >> $GITHUB_OUTPUT
      # Detect npm changes.
      - name: NPM hashes
        if: ${{ inputs.npm-package != '' }}
        id: npm
        run: |
          nix develop github:rainlanguage/rainix/${{ env.RAINIX_SHA }}#rust-node-shell -c bash -c '
            OLD=$(npm view ${{ inputs.npm-package }}@latest dist.shasum 2>/dev/null || echo "none")
            NEW=$(npm pack --silent | xargs shasum | cut -c1-40)
            rm -f *.tgz
            echo "old=$OLD" >> $GITHUB_OUTPUT
            echo "new=$NEW" >> $GITHUB_OUTPUT
            if [ "$OLD" = "$NEW" ]; then echo "changed=false" >> $GITHUB_OUTPUT; else echo "changed=true" >> $GITHUB_OUTPUT; fi
          '
      # Soldeer content gate. `rainix-static soldeer-gate` compares the
      # NORMALIZED content of what `forge soldeer push --dry-run` would upload
      # against the newest published revision, hashing SOURCE ONLY — everything
      # under `src/generated/` (the per-release `<tag>/` snapshots and generated
      # aliasing libs) is excluded, since it is derived from source and a fresh
      # `<tag>/` dir appears every release, which would otherwise flag "changed"
      # on every merge and republish identical bytecode forever; foundry.toml's
      # `[external.package]` / legacy `[package]` release-metadata section (and
      # the comment block attached above it) is excluded from the hash, so
      # carrying, editing, or deleting that section is never a content change.
      # It derives the publish version as max(patch_bump(newest published),
      # newest next-v intent tag merged into HEAD) under semver ordering — a
      # first publish (no revisions yet) requires a next-v tag as the explicit
      # seed, and a malformed next-v tag is a loud error — and emits
      # changed / version. The gate logic is Rust, not inline bash or Python
      # (rainix-static/src/main.rs); the workflow just runs it inside
      # sol-shell, where forge, curl and git are on PATH.
      - name: Soldeer content gate
        if: ${{ inputs.soldeer-package != '' }}
        id: soldeer
        # Pass interpolations through env, never into the shell script directly
        # (avoids GitHub Actions template injection; this is a reusable workflow
        # whose inputs come from arbitrary callers).
        env:
          SOLDEER_PACKAGE: ${{ inputs.soldeer-package }}
        run: |
          set -euo pipefail
          nix develop github:rainlanguage/rainix/${{ env.RAINIX_SHA }}#sol-shell -c \
            rainix-static soldeer-gate \
            --package "$SOLDEER_PACKAGE" \
            --github-output "$GITHUB_OUTPUT"
      # Publish gate on this commit's own CI (rainlanguage/rainix#326): the
      # caller's test workflows race this run on the same push, so nothing
      # bumps, tags, or publishes until every other workflow run on
      # github.sha is green (semantics: rainix-static/src/ci_gate.rs). Gated
      # on the change outputs so a no-op push skips the wait. `nix run`, no
      # dev shell: the wrapped binary carries its own curl + CA bundle, so
      # all callers pay only the small rainix-static closure.
      - name: Gate on commit CI
        if: ${{ steps.cargo.outputs.changed == 'true' || steps.npm.outputs.changed == 'true' || steps.soldeer.outputs.changed == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nix run github:rainlanguage/rainix/${{ env.RAINIX_SHA }}#rainix-static -- ci-gate
      # Run the test suite only when something is actually going to publish. The
      # change gates above are cheap (cargo package --no-verify + a hash compare,
      # an npm/soldeer version lookup); the full workspace test is the expensive
      # step. Gating it here means a no-op push to main (CI/doc changes, an empty
      # re-trigger commit, an unchanged crate) short-circuits without paying for
      # it. PR CI already tested the code before merge; this is the pre-publish
      # gate on the exact merged commit.
      - name: Cargo test
        if: ${{ (inputs.crates != '' || inputs.crate != '') && (steps.cargo.outputs.changed == 'true' || steps.npm.outputs.changed == 'true' || steps.soldeer.outputs.changed == 'true') }}
        run: nix develop github:rainlanguage/rainix/${{ env.RAINIX_SHA }}#rust-shell -c cargo test --workspace
      # Bump versions. One cargo-release invocation bumps every listed crate and
      # rewrites their inter-crate version pins atomically in one commit.
      #
      # The bump commit is then amended to start with "Package Release" so the
      # job-level `if: !startsWith(..., 'Package Release')` guard skips the run
      # this push triggers. Otherwise cargo-release's default message
      # ("chore: Release") re-triggers the workflow, and concurrent re-runs race
      # on the same version bump (tag collisions). NPM bumps already commit a
      # "Package Release npm-…" message, so only the cargo bump needs this.
      - name: Bump Cargo version
        if: ${{ steps.cargo.outputs.changed == 'true' }}
        run: |
          set -euo pipefail
          PKGS=""
          for CRATE in $CRATES; do PKGS="$PKGS -p $CRATE"; done
          nix develop github:rainlanguage/rainix/${{ env.RAINIX_SHA }}#rust-shell -c cargo release --no-confirm --execute --no-tag --no-push --no-publish $PKGS ${{ inputs.level }}
          git commit --amend -m "Package Release: cargo version bump ($CRATES)"
      - name: Bump NPM version
        if: ${{ inputs.npm-package != '' && steps.npm.outputs.changed == 'true' }}
        run: |
          NEW=$(nix develop github:rainlanguage/rainix/${{ env.RAINIX_SHA }}#rust-node-shell -c npm version patch --no-git-tag-version)
          echo "NPM_VERSION=$NEW" >> $GITHUB_ENV
          git add package.json package-lock.json
          git commit -m "Package Release npm-${NEW}"
      # Publish the gate-derived version (steps.soldeer.outputs.version). The
      # version lives in the push spec only: foundry.toml is not read for
      # release metadata and not rewritten — the uploaded zip carries whatever
      # foundry.toml the repo has.
      - name: Publish to Soldeer
        if: ${{ inputs.soldeer-package != '' && steps.soldeer.outputs.changed == 'true' }}
        env:
          SOLDEER_API_TOKEN: ${{ secrets.SOLDEER_API_TOKEN }}
          SOLDEER_PACKAGE: ${{ inputs.soldeer-package }}
          SOLDEER_VERSION: ${{ steps.soldeer.outputs.version }}
        run: |
          set -euo pipefail
          nix develop github:rainlanguage/rainix/${{ env.RAINIX_SHA }}#sol-shell -c forge soldeer push "$SOLDEER_PACKAGE~$SOLDEER_VERSION"
      # Tag the published content — the commit that triggered this run — and
      # push ONLY the tag ref. Deliberately decoupled from any branch push:
      # consumer mains are commonly branch-protected, and the sol-v tag +
      # release must not depend on a branch push being allowed. There is no
      # soldeer bump commit at all; the branch is never written.
      - name: Tag Soldeer release
        if: ${{ inputs.soldeer-package != '' && steps.soldeer.outputs.changed == 'true' }}
        env:
          SOLDEER_VERSION: ${{ steps.soldeer.outputs.version }}
        run: |
          set -euo pipefail
          git tag "sol-v$SOLDEER_VERSION" "${{ github.sha }}"
          git push origin "refs/tags/sol-v$SOLDEER_VERSION"
      # The soldeer GitHub release rides directly on the tag above, before any
      # branch push, for the same decoupling reason.
      - name: GitHub Release (soldeer)
        if: ${{ inputs.soldeer-package != '' && steps.soldeer.outputs.changed == 'true' }}
        uses: rainlanguage/rainix/.github/actions/gh-release@main
        with:
          tag-name: sol-v${{ steps.soldeer.outputs.version }}
          name: Soldeer Release sol-v${{ steps.soldeer.outputs.version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # Tag + push the cargo/npm release commits in one shot. cargo tags are
      # namespaced <crate>-v<version>; rebase onto any concurrent push first
      # (only the shared Cargo.lock is expected to conflict). Soldeer is absent
      # here on purpose: it never creates a commit, and its tag is pushed by
      # its own step above.
      - name: Tag and push
        if: ${{ steps.cargo.outputs.changed == 'true' || steps.npm.outputs.changed == 'true' }}
        run: |
          set -euo pipefail
          git fetch origin
          # Entering the devShell can rewrite generated tracked files (e.g. a
          # nix-store pre-commit-config symlink), which dirties the tree. The
          # release commit is already made, so restore all such leftovers
          # before the rebase, or it aborts with "cannot rebase: You have
          # unstaged changes".
          git checkout -- .
          if ! git rebase "origin/${{ github.ref_name }}"; then
            if [ -n "${{ inputs.crates }}" ] || [ -n "${{ inputs.crate }}" ]; then
              # Only the shared Cargo.lock is expected to conflict.
              nix develop github:rainlanguage/rainix/${{ env.RAINIX_SHA }}#rust-shell -c cargo generate-lockfile
              git add Cargo.lock
              GIT_EDITOR=true git rebase --continue
            else
              echo "rebase onto origin/${{ github.ref_name }} conflicted, and there is no crate lockfile to regenerate; resolve manually" >&2
              exit 1
            fi
          fi
          if [ "${{ steps.cargo.outputs.changed }}" = "true" ]; then
            for CRATE in $CRATES; do
              VER=$(nix develop github:rainlanguage/rainix/${{ env.RAINIX_SHA }}#rust-shell -c cargo pkgid -p "$CRATE" | cut -d@ -f2)
              git tag "$CRATE-v$VER"
            done
          fi
          if [ -n "${{ env.NPM_VERSION }}" ]; then git tag npm-${{ env.NPM_VERSION }}; fi
          git push origin HEAD
          git push origin --tags
      # Package npm tarball for upload step.
      - name: NPM pack
        if: ${{ inputs.npm-package != '' && steps.npm.outputs.changed == 'true' }}
        run: |
          TARBALL=$(nix develop github:rainlanguage/rainix/${{ env.RAINIX_SHA }}#rust-node-shell -c npm pack --silent)
          mv "$TARBALL" npm_package_${{ env.NPM_VERSION }}.tgz
      # Publishes. Crates publish in dependency order so each crate's deps are
      # already on the registry when it publishes.
      - name: Publish to crates.io
        if: ${{ steps.cargo.outputs.changed == 'true' }}
        run: |
          set -euo pipefail
          for CRATE in $CRATES; do
            nix develop github:rainlanguage/rainix/${{ env.RAINIX_SHA }}#rust-shell -c cargo publish -p "$CRATE"
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      # npm publishes authenticate via OIDC trusted publishing — the mechanism
      # raindex's npm-package-release.yml already publishes
      # @rainlanguage/orderbook with — replacing the NPM_PUBLISH_PRIVATE_TOKEN
      # path, which E404s when the token cannot write the package
      # (rain.math.float.deploy#4). setup-node's registry-url writes the
      # .npmrc npm's OIDC flow expects; publishing an already-packed tarball
      # needs no project toolchain, so these steps run outside the nix shells
      # on purpose (raindex does the same).
      - name: Setup node for OIDC npm publish
        if: ${{ inputs.npm-package != '' && steps.npm.outputs.changed == 'true' && steps.npm.outputs.old != 'none' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1 (OIDC token exchange +
      # automatic provenance); setup-node's bundled npm can lag behind that.
      - name: Upgrade npm for OIDC
        if: ${{ inputs.npm-package != '' && steps.npm.outputs.changed == 'true' && steps.npm.outputs.old != 'none' }}
        run: |
          npm install -g npm@latest
          npm --version
      # Fail fast with an actionable message when the Actions OIDC endpoint is
      # not reachable. For a reusable workflow the CALLER's job must also grant
      # `id-token: write` — this job's own permission block can only downgrade
      # what the caller passed, never elevate it — so a missing caller grant
      # would otherwise surface as an opaque ENEEDAUTH from npm.
      - name: Verify OIDC availability
        if: ${{ inputs.npm-package != '' && steps.npm.outputs.changed == 'true' && steps.npm.outputs.old != 'none' }}
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "GitHub OIDC token unavailable: the calling workflow's job must grant permissions: {id-token: write, contents: write}" >&2
            exit 1
          fi
      # A package's FIRST-EVER publish cannot use OIDC: npmjs.com only lets a
      # Trusted Publisher be configured on a package that already exists, so
      # the seed version publishes with the legacy token (raindex keeps the
      # same fallback for the same reason). The npm gate's `old` output is the
      # registry's answer: 'none' means never published.
      - name: Publish to NPM (first publish)
        if: ${{ inputs.npm-package != '' && steps.npm.outputs.changed == 'true' && steps.npm.outputs.old == 'none' }}
        uses: JS-DevTools/npm-publish@19c28f1ef146469e409470805ea4279d47c3d35c # v3
        with:
          token: ${{ secrets.NPM_PUBLISH_PRIVATE_TOKEN }}
          access: public
          package: npm_package_${{ env.NPM_VERSION }}.tgz
      - name: Publish to NPM
        if: ${{ inputs.npm-package != '' && steps.npm.outputs.changed == 'true' && steps.npm.outputs.old != 'none' }}
        run: npm publish "npm_package_$NPM_VERSION.tgz" --access public --tag latest --verbose
      # GitHub Releases. One per crate (loop), plus npm; the soldeer release
      # is created earlier, right after its tag push.
      - name: GitHub Release (cargo)
        if: ${{ steps.cargo.outputs.changed == 'true' }}
        run: |
          set -euo pipefail
          for CRATE in $CRATES; do
            VER=$(nix develop github:rainlanguage/rainix/${{ env.RAINIX_SHA }}#rust-shell -c cargo pkgid -p "$CRATE" | cut -d@ -f2)
            gh release create "$CRATE-v$VER" --title "$CRATE-v$VER" --notes "Automated release of $CRATE $VER." || true
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: GitHub Release (npm)
        if: ${{ inputs.npm-package != '' && steps.npm.outputs.changed == 'true' }}
        uses: rainlanguage/rainix/.github/actions/gh-release@main
        with:
          tag-name: npm-${{ env.NPM_VERSION }}
          name: NPM Package Release ${{ env.NPM_VERSION }}
          files: npm_package_${{ env.NPM_VERSION }}.tgz
          github-token: ${{ secrets.GITHUB_TOKEN }}
