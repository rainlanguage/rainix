name: rainix-subgraph-deploy
on:
  workflow_call:
    inputs:
      subgraph-dir:
        type: string
        default: subgraph
        description: |
          `SUBGRAPH_DIR`: the subgraph's directory in the repo root. It has
          `networks.json` (one address per network) or `manifests/<network>.yaml`
          (one manifest per network).
      subgraph-name:
        type: string
        required: true
        description: |
          `SUBGRAPH_NAME`: each network in `subgraph/networks.json` deploys as
          `<subgraph-name>-<network>`.
      ormi-query-base:
        type: string
        default: https://subgraph.api.ormilabs.com/api/public/9f4fc2fa-4a15-44f7-a7c1-66fdaa518a71
        description: |
          `ORMI_QUERY_BASE`: public query base of the Ormi account the deploy
          key belongs to, probed to skip a version that is already live. The
          default is the org account ORMI_DEPLOY_KEY deploys to.
      goldsky-query-base:
        type: string
        default: https://api.goldsky.com/api/public/project_clv14x04y9kzi01saerx7bxpg
        description: |
          `GOLDSKY_QUERY_BASE`: public query base of the Goldsky project the
          token deploys to, for networks Ormi does not index
          (`rainix-static subgraph-targets` names the host). The default is the
          org project CI_GOLDSKY_TOKEN deploys to.
    # Declared so cross-org callers can pass them; `secrets: inherit` does not
    # cross organizations.
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false
      ORMI_DEPLOY_KEY:
        required: true
      CI_GOLDSKY_TOKEN:
        required: false
env:
  RAINIX_SHA: 41a94b6958874e263e9d5adceba1c2181298fc40
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: rainlanguage/rainix/.github/actions/nix-cachix-setup@main
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          gc-max-store-size-linux: 1G
      - run: nix develop github:rainlanguage/rainix/${{ env.RAINIX_SHA }}#subgraph-shell -c subgraph-deploy
        env:
          SUBGRAPH_NAME: ${{ inputs.subgraph-name }}
          SUBGRAPH_DIR: ${{ inputs.subgraph-dir }}
          ORMI_QUERY_BASE: ${{ inputs.ormi-query-base }}
          ORMI_DEPLOY_KEY: ${{ secrets.ORMI_DEPLOY_KEY }}
          GOLDSKY_QUERY_BASE: ${{ inputs.goldsky-query-base }}
          GOLDSKY_TOKEN: ${{ secrets.CI_GOLDSKY_TOKEN }}
