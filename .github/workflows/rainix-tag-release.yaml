name: rainix-tag-release
# Tag-triggered release for DEPLOY repos (verify + publish; the deploy itself and
# the snapshot cut both happen BEFORE this workflow — see below). The counterpart
# to rainix-autopublish's merge-driven publish for LIBRARY repos.
#
# The two lifecycles are mutually exclusive and a repo is strictly one or the
# other:
#
#   * A LIBRARY repo (rainix-autopublish) publishes on content change at
#     merge: the publish version is derived from the registry (newest
#     published revision, patch-bumped) with `next-v<x.y.z>` git tags carrying
#     any larger version intent, foundry.toml holds no release metadata, and
#     nothing is ever committed or pushed back to the branch.
#     Consumers import its abstract surface (interfaces/libs); it never pins a
#     deployed address, so it carries no per-tag deploy-pin snapshot.
#
#   * A DEPLOY repo (this workflow) records deployed addresses. Its
#     src/generated/<tag>/ snapshot pins the address + codehash of what it
#     deployed, frozen so consumers can rely on them (enforced by the
#     frozen-snapshots-append-only gate at PR time). [package].version is the
#     LAST released version, and moves ONLY at release time, in lockstep with the
#     snapshot it describes.
#
# The release is PUSH-FREE (rainlanguage/rainix#338). Deploy repo mains are
# branch-protected, and rainix-autopublish was already made push-free in
# #335/#336; a deploy release must work the same way. So this workflow never
# commits and never pushes to any branch — a push to a protected main is rejected
# (GH006) and would fail the release after publishing.
#
# The release flow, in order:
#   1. Deploy on-chain (the repo's own human-driven rainix-manual-sol-artifacts
#      dispatch — NOT this workflow; see below).
#   2. Open a PR that regenerates + commits the frozen src/generated/<version>/
#      snapshot and bumps [package].version. That PR's normal CI runs the
#      frozen-snapshots-append-only gate (rainix-sol-static) and the fork suite
#      that asserts the live chain matches the pins (rainix-sol-test), so the
#      deploy pins consumers trust are reviewed and verified BEFORE they publish.
#   3. A human merges the PR (normal protected-merge) and pushes a
#      `sol-v<version>` tag on the merged commit.
#   4. This workflow runs on that tag: it re-derives the version from the tag,
#      re-runs the snapshot generator to prove the tagged commit's snapshot is a
#      fresh deterministic regeneration (the fail-closed publish guard below),
#      re-attests the live chain matches the pins, then publishes to Soldeer and
#      creates the GitHub release. main already carries the snapshot (from the
#      merged PR), so the daily drift sweep and the repo's own snapshot tests keep
#      reading src/generated/<version>/ from main unchanged.
#
# Because the snapshot reaches main via the reviewed PR and never via this
# workflow, the workflow has nothing to commit — it is read-only publish + tag +
# GitHub-release.
#
# The on-chain DEPLOY is deliberately NOT part of this workflow. A deploy is
# flaky by nature — per-network, funds-dependent, and at the mercy of RPC
# archive/fork behaviour — and a flaky, retry-prone operation must not gate a
# one-shot tag publish, where a single transient failure would block the release
# entirely. So the deploy stays the repo's own human-driven
# rainix-manual-sol-artifacts dispatch, run BEFORE tagging. This workflow does not
# broadcast; it ATTESTS that the broadcast already landed: the `verify` step (the
# repo's fork suite) checks prod exists at the freshly regenerated pins, and a
# release whose pins don't resolve on-chain fails there and publishes nothing.
#
# The publish guard is the point of the push-free change: the workflow no longer
# cuts the snapshot, so a human could tag a commit whose snapshot was never
# regenerated (mistag, stale PR, hand-edit) and it would publish silently. The
# guard fails closed against that — see the `Publish guard` step.
on:
  workflow_call:
    inputs:
      soldeer-package:
        description: Soldeer registry package name to publish (e.g. st0x-deploy).
        required: true
        type: string
      tag-prefix:
        description: >-
          Prefix stripped from the pushed tag to derive the release version, e.g. `sol-v` turns tag `sol-v0.1.29` into version `0.1.29`. The caller restricts which tags trigger the release via its own `on: push: tags` filter; this only parses the version out of the ref.
        required: false
        type: string
        default: sol-v
      snapshot-generate-cmd:
        description: >-
          Command that cuts the release: it regenerates the rolling `src/generated/candidate/` pins from the current source and freezes a copy of them as `src/generated/<tag>/`, in that order and in one call, then formats. `BuildScript.cutRelease()` is that call, so the default is the whole of it for a deploy repo whose `script/Build.sol` extends `BuildScript` and such a repo passes nothing. Run after `[package].version` is set to the release version, so the tag the freeze derives from it is the one being released.
        required: false
        type: string
        default: 'forge script ./script/Build.sol --sig "cutRelease()" && forge fmt'
      test-cmd:
        description: >-
          Pre-publish verification gate. Run against the regenerated snapshot; for a deploy repo this is the fork suite that reads the live chain and asserts it matches the fresh pins, so a release that snapshots addresses the chain does not actually carry fails loud BEFORE publishing. Default `forge test`.
        required: false
        type: string
        default: forge test
      main-branch:
        description: >-
          The release branch the tagged commit must already be merged into (the guard's tag-on-main ancestry check). Nothing is committed back to it — the snapshot reaches main via the reviewed PR, not this workflow.
        required: false
        type: string
        default: main
    secrets:
      # The release is push-free: this workflow makes no commit and no branch
      # push, so PUBLISH_PRIVATE_KEY (deploy key), CI_GIT_EMAIL and CI_GIT_USER
      # are no longer used here. They stay declared (required: false) so callers
      # that pass them by name — rather than `secrets: inherit` — do not break.
      PUBLISH_PRIVATE_KEY:
        required: false
      CI_GIT_EMAIL:
        required: false
      CI_GIT_USER:
        required: false
      SOLDEER_API_TOKEN:
        # This workflow always publishes, so a missing token is a setup error to
        # catch before the deploy/regenerate work, not after.
        required: true
      CACHIX_AUTH_TOKEN:
        required: false
      RPC_URL_ARBITRUM_FORK:
        required: false
      RPC_URL_BASE_FORK:
        required: false
      RPC_URL_BASE_SEPOLIA_FORK:
        required: false
      RPC_URL_ETHEREUM_FORK:
        required: false
      RPC_URL_FLARE_FORK:
        required: false
      RPC_URL_HYPEREVM_FORK:
        required: false
      RPC_URL_POLYGON_FORK:
        required: false
env:
  RAINIX_SHA: 5c00627bfaa83920c87596310be4c3f7b345b23d
jobs:
  # The release tag must point at a commit already merged to the release branch.
  # `on: push: tags` fires for ANY tag, including one cut from an unmerged branch;
  # without this the later rebase would replay that branch's unreviewed commits
  # onto main and push them. Gate `release` on it. All refs come from built-in env
  # vars, never interpolated into the shell, to avoid template injection.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: rainlanguage/rainix/.github/actions/checkout@main
      - name: Tag must be a tag on the release branch
        env:
          MAIN: ${{ inputs.main-branch }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/*) : ;;
            *) echo "::error::rainix-tag-release must be triggered by a tag push, got $GITHUB_REF" >&2; exit 1 ;;
          esac
          # The shared checkout is shallow; unshallow so the ancestry test can see
          # whether the tag commit is on the release branch.
          if [ -f "$(git rev-parse --git-dir)/shallow" ]; then
            git fetch --no-tags --unshallow origin
          fi
          git fetch --no-tags origin "$MAIN"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$MAIN"; then
            echo "::error::tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on origin/$MAIN — refusing to release an unmerged commit" >&2
            exit 1
          fi
  release:
    needs: guard
    runs-on: ubuntu-latest
    # contents: write for the gh-release composite only. No branch push here (the
    # release is push-free), and no id-token: nothing uses OIDC (Soldeer uses
    # SOLDEER_API_TOKEN, the release uses GITHUB_TOKEN).
    permissions:
      contents: write
    steps:
      # Plain (GITHUB_TOKEN) checkout of the tagged commit: the release makes no
      # branch push, so it needs no deploy key. The pinned checkout / cache-nix /
      # nix-install / Cachix SHAs all live once in the composites; the nix preamble
      # then runs with checkout:'false'.
      - uses: rainlanguage/rainix/.github/actions/checkout@main
      - uses: rainlanguage/rainix/.github/actions/nix-cachix-setup@main
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          checkout: 'false'
      - name: Hide devShell leftovers from the determinism check
        # Entering the devShell writes a generated .pre-commit-config.yaml into the
        # tree; hide it via the local exclude so it never counts as a change in the
        # publish guard's `git status` determinism check (repo-agnostic, no consumer
        # needs to .gitignore it).
        run: echo ".pre-commit-config.yaml" >> .git/info/exclude
      - name: Install soldeer dependencies
        if: ${{ hashFiles('soldeer.lock') != '' }}
        run: nix develop github:rainlanguage/rainix/${{ env.RAINIX_SHA }}#sol-shell -c forge soldeer install
      - name: Resolve release version from the tag
        # Strip the caller's tag-prefix; a tag that does not carry it is a
        # misconfigured trigger, not a release.
        env:
          TAG_PREFIX: ${{ inputs.tag-prefix }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            "$TAG_PREFIX"*) VERSION="${TAG#"$TAG_PREFIX"}" ;;
            *) echo "::error::tag '$TAG' does not start with tag-prefix '$TAG_PREFIX'" >&2; exit 1 ;;
          esac
          # Require MAJOR.MINOR.PATCH. Beyond rejecting junk tags (sol-vfoo), this
          # guarantees VERSION is `[0-9.]+` — safe to interpolate into the
          # snapshot-dir path (dots→underscores) below and free of shell/path
          # metacharacters.
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version '$VERSION' from tag '$TAG' is not MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Release version: $VERSION"
      - name: Regenerate the release snapshot (read-only determinism check)
        # Option A lands the frozen src/generated/<version>/ snapshot on main via a
        # reviewed PR; this workflow does NOT cut it. To prove the tagged commit
        # carries a snapshot that IS a fresh deterministic regeneration — not stale,
        # hand-edited, or never cut — regenerate it here and let the publish guard
        # below require a clean tree. The generator freezes a NEW <version>/ dir and
        # may refuse to overwrite an existing one (e.g. cut-release.sh), so remove
        # the committed dir first; git still holds it, and the guard checks presence
        # against HEAD and diffs the regenerated tree against HEAD. Nothing is
        # committed or pushed — the runner tree is thrown away. Deterministic from
        # bytecode (address = f(bytecode) under CREATE2), so no chain access here;
        # the on-chain attestation is a later step.
        env:
          # Via env, not interpolated into the script body: a workflow input
          # spliced into `run:` text is a template-injection surface. The
          # expansion is one word, which bash then reads as the script.
          SNAPSHOT_GENERATE_CMD: ${{ inputs.snapshot-generate-cmd }}
        # `set -euo pipefail` so a command written as `a; b` cannot hide a's
        # failure behind b's success.
        run: |
          set -euo pipefail
          # VERSION is validated strict X.Y.Z above, so DIR is [0-9_]+.
          DIR="${VERSION//./_}"
          rm -rf "src/generated/${DIR}"
          nix develop github:rainlanguage/rainix/${{ env.RAINIX_SHA }}#sol-shell -c bash -c "set -euo pipefail; $SNAPSHOT_GENERATE_CMD"
      - name: Publish guard (fail-closed)
        # The point of the push-free change: refuse to publish a tag whose commit
        # did not actually cut this release's snapshot. All three must hold or the
        # release fails loud and publishes NOTHING — foundry.toml [package].version
        # == the tag version; src/generated/<version>/ present in the tagged commit;
        # and the regeneration above changed nothing (git status clean → the
        # committed snapshot is a deterministic regeneration, not stale/hand-edited).
        # Logic is Rust (rainix-static release-guard), unit-tested and
        # mutation-covered; the append-only gate ran at PR time (rainix-sol-static).
        # VERSION comes from $GITHUB_ENV, never a ${{ }} splice, so it cannot inject
        # into the command.
        run: nix develop github:rainlanguage/rainix/${{ env.RAINIX_SHA }}#sol-shell -c rainix-static release-guard --version "$VERSION"
      # The fork suite below rolls back to the freshly regenerated pins, so it
      # needs archive endpoints. Candidate URLs travel as env, never as `with:`
      # inputs — GitHub renders a composite's resolved inputs into the log and a
      # keyed URL embeds its API key.
      - name: RPC preflight
        uses: rainlanguage/rainix/.github/actions/rpc-preflight@main
        env:
          RAINIX_RPC_SECRET_ARBITRUM: ${{ secrets.RPC_URL_ARBITRUM_FORK }}
          RAINIX_RPC_VARS_ARBITRUM: ${{ vars.RPC_URL_ARBITRUM_FORK }}
          RAINIX_RPC_SECRET_BASE: ${{ secrets.RPC_URL_BASE_FORK }}
          RAINIX_RPC_VARS_BASE: ${{ vars.RPC_URL_BASE_FORK }}
          RAINIX_RPC_SECRET_BASE_SEPOLIA: ${{ secrets.RPC_URL_BASE_SEPOLIA_FORK }}
          RAINIX_RPC_VARS_BASE_SEPOLIA: ${{ vars.RPC_URL_BASE_SEPOLIA_FORK }}
          RAINIX_RPC_SECRET_ETHEREUM: ${{ secrets.RPC_URL_ETHEREUM_FORK }}
          RAINIX_RPC_VARS_ETHEREUM: ${{ vars.RPC_URL_ETHEREUM_FORK }}
          RAINIX_RPC_SECRET_FLARE: ${{ secrets.RPC_URL_FLARE_FORK }}
          RAINIX_RPC_VARS_FLARE: ${{ vars.RPC_URL_FLARE_FORK }}
          RAINIX_RPC_SECRET_HYPEREVM: ${{ secrets.RPC_URL_HYPEREVM_FORK }}
          RAINIX_RPC_VARS_HYPEREVM: ${{ vars.RPC_URL_HYPEREVM_FORK }}
          RAINIX_RPC_SECRET_POLYGON: ${{ secrets.RPC_URL_POLYGON_FORK }}
          RAINIX_RPC_VARS_POLYGON: ${{ vars.RPC_URL_POLYGON_FORK }}
      - name: Verify live chain matches the fresh pins
        # The manual deploy was run before tagging; this is the attestation that it
        # landed — the fork suite checks prod exists at the freshly regenerated
        # pins, so a snapshot of addresses the chain does not carry never gets
        # published. A transient fork/RPC failure here just fails the release
        # (retry the tag); it publishes nothing and is not a broadcast.
        # foundry.toml's [rpc_endpoints] read ${<NETWORK>_RPC_URL}, NOT the
        # RPC_URL_<NETWORK>_FORK secret names — an env var named after the secret
        # leaves ${ARBITRUM_RPC_URL} unset and createSelectFork fails "env var not
        # found". rpc-preflight above binds each env name foundry expects to a
        # candidate that is healthy right now, which a static one-URL mapping
        # cannot do.
        run: nix develop github:rainlanguage/rainix/${{ env.RAINIX_SHA }}#sol-shell -c bash -c '${{ inputs.test-cmd }}'
      - name: Publish to Soldeer
        # Pushes the working tree — the tagged commit's tree, whose snapshot the
        # publish guard just verified is present and deterministic — under the exact
        # version the tag names. No branch is written: main already carries this
        # snapshot from the reviewed PR that cut it.
        env:
          SOLDEER_API_TOKEN: ${{ secrets.SOLDEER_API_TOKEN }}
          SOLDEER_PACKAGE: ${{ inputs.soldeer-package }}
        run: nix develop github:rainlanguage/rainix/${{ env.RAINIX_SHA }}#sol-shell -c forge soldeer push "$SOLDEER_PACKAGE~$VERSION"
      - name: GitHub Release
        uses: rainlanguage/rainix/.github/actions/gh-release@main
        with:
          tag-name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
