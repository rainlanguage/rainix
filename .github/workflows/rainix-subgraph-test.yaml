name: rainix-subgraph-test
on:
  workflow_call:
    inputs:
      subgraph-dir:
        type: string
        default: subgraph
        description: |
          `SUBGRAPH_DIR`: the subgraph's directory in the repo root.
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false
env:
  RAINIX_SHA: 41a94b6958874e263e9d5adceba1c2181298fc40
jobs:
  subgraph-test:
    runs-on: ubuntu-latest
    steps:
      # Shared nix + cachix CI preamble (checkout, nix-quick-install, Cachix,
      # cache-nix-action) — pinned action SHAs live in the composite. Fully
      # qualified ref: a bare `./` would resolve against the calling repo.
      - uses: rainlanguage/rainix/.github/actions/nix-cachix-setup@main
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix develop github:rainlanguage/rainix/${{ env.RAINIX_SHA }}#subgraph-shell -c subgraph-test
        env:
          SUBGRAPH_DIR: ${{ inputs.subgraph-dir }}
