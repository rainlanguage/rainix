name: rainix-sol-test
on:
  workflow_call:
    secrets:
      PRIVATE_KEY:
        required: false
      EXPLORER_VERIFICATION_KEY:
        required: false
      RPC_URL_ARBITRUM_FORK:
        required: false
      RPC_URL_BASE_FORK:
        required: false
      RPC_URL_BASE_SEPOLIA_FORK:
        required: false
      RPC_URL_ETHEREUM_FORK:
        required: false
      RPC_URL_FLARE_FORK:
        required: false
      RPC_URL_HYPEREVM_FORK:
        required: false
      RPC_URL_POLYGON_FORK:
        required: false
      RPC_URL_ROBINHOOD_FORK:
        required: false
      RPC_URL_BSC_FORK:
        required: false
      RPC_URL_SEPOLIA_FORK:
        required: false
env:
  RAINIX_SHA: 2aea60e5c4004cfaeb6168f26e71b3ed695fd349
jobs:
  test:
    runs-on: ubuntu-latest
    # A newer push to the same branch cancels the run it makes stale: only
    # the newest commit's result matters there, and a stale run still pays
    # for every fork read. Default branch, tags, schedules and dispatches get
    # their own group per run, and never cancel, so each of those runs to
    # completion (a queued dispatch is not replaced by a newer one either).
    # Pull request runs group by event and PR number: on `pull_request_target`
    # the ref is the base branch, so two PRs would otherwise cancel each other,
    # and a caller on both PR events keeps one run of each.
    concurrency:
      group: rainix-sol-test-${{ github.repository }}-${{ github.workflow }}-${{ (github.event_name != 'pull_request_target' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && format('{0}-{1}-{2}-{3}', github.event_name, github.ref, github.sha, github.run_id) || (github.event.pull_request.number && format('pr-{0}-{1}', github.event_name, github.event.pull_request.number) || github.ref) }}
      cancel-in-progress: ${{ !(github.event_name != 'pull_request_target' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) }}
    env:
      # Whether the RPC_URL_<NETWORK>_FORK secrets reach the proxy, as the last
      # upstream behind the public ones. Every run except
      # `pull_request_target`, which runs untrusted code with secrets in reach
      # and so forks on public endpoints only.
      RAINIX_FORK_SECRETS: ${{ github.event_name != 'pull_request_target' }}
      DEPLOYMENT_KEY: ${{ secrets.PRIVATE_KEY }}
      ETHERSCAN_API_KEY: ${{ secrets.EXPLORER_VERIFICATION_KEY }}
      CI_FORK_SEPOLIA_BLOCK_NUMBER: ${{ vars.CI_FORK_SEPOLIA_BLOCK_NUMBER }}
      CI_FORK_SEPOLIA_DEPLOYER_ADDRESS: ${{ vars.CI_FORK_SEPOLIA_DEPLOYER_ADDRESS }}
      # <NETWORK>_RPC_URL is NOT set here: the rpc-proxy step below points
      # each one the repo uses at a local eRPC that fails over per request.
    steps:
      # Shared nix + cachix CI preamble (checkout, nix-quick-install, Cachix,
      # cache-nix-action) — pinned action SHAs live in the composite. Fully
      # qualified ref: a bare `./` would resolve against the calling repo.
      - uses: rainlanguage/rainix/.github/actions/nix-cachix-setup@main
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Cache Foundry's incremental compilation cache + artifacts so unchanged
      # contracts aren't recompiled (forge build is the dominant CI cost).
      - name: Cache Foundry build
        uses: rainlanguage/rainix/.github/actions/cache@main
        with:
          path: |
            cache
            out
          key: foundry-full-${{ runner.os }}-${{ hashFiles('src/**/*.sol', 'test/**/*.sol', 'script/**/*.sol', 'foundry.toml', 'soldeer.lock', 'remappings.txt') }}
          restore-keys: |
            foundry-full-${{ runner.os }}-
      - name: Install soldeer dependencies
        if: hashFiles('soldeer.lock') != ''
        run: nix develop github:rainlanguage/rainix/${{ env.RAINIX_SHA }}#sol-shell -c forge soldeer install
      # Serve every <NETWORK>_RPC_URL foundry.toml reads from a local eRPC:
      # public upstreams first, the paid secret last, and each request fails
      # over on its own, so one throttled read no longer fails the suite.
      # Candidate URLs travel as env, never as `with:` inputs, because GitHub
      # renders a composite's resolved inputs into the log and a keyed URL
      # embeds its API key.
      - name: RPC proxy
        uses: rainlanguage/rainix/.github/actions/rpc-proxy@main
        env:
          RAINIX_RPC_SECRET_ARBITRUM: ${{ env.RAINIX_FORK_SECRETS == 'true' && secrets.RPC_URL_ARBITRUM_FORK || '' }}
          RAINIX_RPC_VARS_ARBITRUM: ${{ vars.RPC_URL_ARBITRUM_FORK }}
          RAINIX_RPC_SECRET_BASE: ${{ env.RAINIX_FORK_SECRETS == 'true' && secrets.RPC_URL_BASE_FORK || '' }}
          RAINIX_RPC_VARS_BASE: ${{ vars.RPC_URL_BASE_FORK }}
          RAINIX_RPC_SECRET_BASE_SEPOLIA: ${{ env.RAINIX_FORK_SECRETS == 'true' && secrets.RPC_URL_BASE_SEPOLIA_FORK || '' }}
          RAINIX_RPC_VARS_BASE_SEPOLIA: ${{ vars.RPC_URL_BASE_SEPOLIA_FORK }}
          RAINIX_RPC_SECRET_ETHEREUM: ${{ env.RAINIX_FORK_SECRETS == 'true' && secrets.RPC_URL_ETHEREUM_FORK || '' }}
          RAINIX_RPC_VARS_ETHEREUM: ${{ vars.RPC_URL_ETHEREUM_FORK }}
          RAINIX_RPC_SECRET_FLARE: ${{ env.RAINIX_FORK_SECRETS == 'true' && secrets.RPC_URL_FLARE_FORK || '' }}
          RAINIX_RPC_VARS_FLARE: ${{ vars.RPC_URL_FLARE_FORK }}
          RAINIX_RPC_SECRET_HYPEREVM: ${{ env.RAINIX_FORK_SECRETS == 'true' && secrets.RPC_URL_HYPEREVM_FORK || '' }}
          RAINIX_RPC_VARS_HYPEREVM: ${{ vars.RPC_URL_HYPEREVM_FORK }}
          RAINIX_RPC_SECRET_POLYGON: ${{ env.RAINIX_FORK_SECRETS == 'true' && secrets.RPC_URL_POLYGON_FORK || '' }}
          RAINIX_RPC_VARS_POLYGON: ${{ vars.RPC_URL_POLYGON_FORK }}
          RAINIX_RPC_SECRET_ROBINHOOD: ${{ env.RAINIX_FORK_SECRETS == 'true' && secrets.RPC_URL_ROBINHOOD_FORK || '' }}
          RAINIX_RPC_VARS_ROBINHOOD: ${{ vars.RPC_URL_ROBINHOOD_FORK }}
          RAINIX_RPC_SECRET_BSC: ${{ env.RAINIX_FORK_SECRETS == 'true' && secrets.RPC_URL_BSC_FORK || '' }}
          RAINIX_RPC_VARS_BSC: ${{ vars.RPC_URL_BSC_FORK }}
          RAINIX_RPC_SECRET_SEPOLIA: ${{ env.RAINIX_FORK_SECRETS == 'true' && secrets.RPC_URL_SEPOLIA_FORK || '' }}
          RAINIX_RPC_VARS_SEPOLIA: ${{ vars.RPC_URL_SEPOLIA_FORK }}
      - run: nix develop github:rainlanguage/rainix/${{ env.RAINIX_SHA }}#sol-shell -c forge test -vvv
      - name: RPC proxy report
        if: always()
        uses: rainlanguage/rainix/.github/actions/rpc-proxy@main
        with:
          mode: report
