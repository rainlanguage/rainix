name: rainix-sol-test
on:
  workflow_call:
    inputs:
      paid-fork-rpc-networks:
        description: >-
          Networks whose RPC_URL_<NETWORK>_FORK secret is passed on every run, branches and pull requests included, as a space-separated list of preflight keys (for example `bsc`). For a fork suite that needs a call no public endpoint serves, such as eth_getLogs at an old BSC block. Every other network uses the paid secret only on the default branch, tags, schedules and dispatches. Not on `pull_request_target`, and GitHub withholds secrets from pull requests opened from forks, so a fork PR that needs the paid endpoint is checked by a workflow_dispatch run from a trusted branch.
        type: string
        required: false
        default: ''
    secrets:
      PRIVATE_KEY:
        required: false
      EXPLORER_VERIFICATION_KEY:
        required: false
      RPC_URL_ARBITRUM_FORK:
        required: false
      RPC_URL_BASE_FORK:
        required: false
      RPC_URL_BASE_SEPOLIA_FORK:
        required: false
      RPC_URL_ETHEREUM_FORK:
        required: false
      RPC_URL_FLARE_FORK:
        required: false
      RPC_URL_HYPEREVM_FORK:
        required: false
      RPC_URL_POLYGON_FORK:
        required: false
      RPC_URL_ROBINHOOD_FORK:
        required: false
      RPC_URL_BSC_FORK:
        required: false
      RPC_URL_SEPOLIA_FORK:
        required: false
env:
  RAINIX_SHA: 2aea60e5c4004cfaeb6168f26e71b3ed695fd349
jobs:
  test:
    runs-on: ubuntu-latest
    # A newer push to the same branch cancels the run it makes stale: only
    # the newest commit's result matters there, and a stale run still pays
    # for every fork read. Default branch, tags, schedules and dispatches get
    # their own group per event, ref and commit, and never cancel, so each of
    # those runs to completion (a tag and a main push of one commit included).
    # Pull request runs group by PR number: on `pull_request_target` the ref
    # is the base branch, so two PRs would otherwise cancel each other.
    concurrency:
      group: rainix-sol-test-${{ github.repository }}-${{ github.workflow }}-${{ (github.event_name != 'pull_request_target' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && format('{0}-{1}-{2}', github.event_name, github.ref, github.sha) || (github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref) }}
      cancel-in-progress: ${{ !(github.event_name != 'pull_request_target' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) }}
    env:
      # Whether this run may use the paid fork RPCs in the
      # RPC_URL_<NETWORK>_FORK secrets. True on the default branch, tags,
      # schedules and dispatches. False on every other branch push and on
      # pull requests, `pull_request_target` included (its `github.ref` is the
      # base branch, so the default-branch test alone would pass): those runs
      # fork at latest, so no run can reuse another run's reads, and they are
      # most of the runs. They use the variables and the hardcoded public
      # archive defaults instead, which the preflight health-checks exactly as
      # it does the secret.
      RAINIX_PAID_FORK_RPC: ${{ github.event_name != 'pull_request_target' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
      # The caller's `paid-fork-rpc-networks`, padded for a whole-word match.
      # Empty on `pull_request_target`: that event runs with secrets, so the
      # opt-in never hands a paid URL to it.
      RAINIX_PAID_FORK_RPC_NETWORKS: ${{ github.event_name != 'pull_request_target' && format(' {0} ', inputs.paid-fork-rpc-networks) || '' }}
      # Whether a failed public run gets one retry on the paid secrets: every
      # run that is not already paid, except `pull_request_target`.
      RAINIX_PUBLIC_RETRY: ${{ github.event_name != 'pull_request_target' && !(github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
      DEPLOYMENT_KEY: ${{ secrets.PRIVATE_KEY }}
      ETHERSCAN_API_KEY: ${{ secrets.EXPLORER_VERIFICATION_KEY }}
      CI_FORK_SEPOLIA_BLOCK_NUMBER: ${{ vars.CI_FORK_SEPOLIA_BLOCK_NUMBER }}
      CI_FORK_SEPOLIA_DEPLOYER_ADDRESS: ${{ vars.CI_FORK_SEPOLIA_DEPLOYER_ADDRESS }}
      # <NETWORK>_RPC_URL is NOT set here. foundry.toml's [rpc_endpoints] still
      # read ${<NETWORK>_RPC_URL}, but the rpc-preflight step below picks which
      # candidate to bind to each one and writes it to $GITHUB_ENV. A static
      # mapping cannot fail over, and a single dead upstream reds every fork
      # suite in the org.
    steps:
      # Shared nix + cachix CI preamble (checkout, nix-quick-install, Cachix,
      # cache-nix-action) — pinned action SHAs live in the composite. Fully
      # qualified ref: a bare `./` would resolve against the calling repo.
      - uses: rainlanguage/rainix/.github/actions/nix-cachix-setup@main
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Cache Foundry's incremental compilation cache + artifacts so unchanged
      # contracts aren't recompiled (forge build is the dominant CI cost).
      - name: Cache Foundry build
        uses: rainlanguage/rainix/.github/actions/cache@main
        with:
          path: |
            cache
            out
          key: foundry-full-${{ runner.os }}-${{ hashFiles('src/**/*.sol', 'test/**/*.sol', 'script/**/*.sol', 'foundry.toml', 'soldeer.lock', 'remappings.txt') }}
          restore-keys: |
            foundry-full-${{ runner.os }}-
      - name: Install soldeer dependencies
        if: hashFiles('soldeer.lock') != ''
        run: nix develop github:rainlanguage/rainix/${{ env.RAINIX_SHA }}#sol-shell -c forge soldeer install
      # Bind every <NETWORK>_RPC_URL foundry.toml reads to a candidate that is
      # actually healthy right now, before forge starts. Candidate URLs travel
      # as env, never as `with:` inputs, because GitHub renders a composite's
      # resolved inputs into the log and a keyed URL embeds its API key.
      # A secret is passed only when RAINIX_PAID_FORK_RPC allows it or the
      # caller lists that network in `paid-fork-rpc-networks`; an empty secret
      # is an empty candidate list, so the pool starts at the variable.
      #
      # On a public run (RAINIX_PUBLIC_RETRY) the preflight and the tests may
      # fail without failing the job: a public endpoint can throttle or drop a
      # read halfway through the suite, and nothing inside forge fails over.
      # The two retry steps below then run the whole suite once more on the
      # paid secrets, and only that run decides the job. Paid runs and
      # `pull_request_target` runs get one attempt, and the latter never
      # reaches the paid steps.
      - name: RPC preflight
        id: preflight
        continue-on-error: ${{ env.RAINIX_PUBLIC_RETRY == 'true' }}
        uses: rainlanguage/rainix/.github/actions/rpc-preflight@main
        env:
          RAINIX_RPC_SECRET_ARBITRUM: ${{ (env.RAINIX_PAID_FORK_RPC == 'true' || contains(env.RAINIX_PAID_FORK_RPC_NETWORKS, ' arbitrum ')) && secrets.RPC_URL_ARBITRUM_FORK || '' }}
          RAINIX_RPC_VARS_ARBITRUM: ${{ vars.RPC_URL_ARBITRUM_FORK }}
          RAINIX_RPC_SECRET_BASE: ${{ (env.RAINIX_PAID_FORK_RPC == 'true' || contains(env.RAINIX_PAID_FORK_RPC_NETWORKS, ' base ')) && secrets.RPC_URL_BASE_FORK || '' }}
          RAINIX_RPC_VARS_BASE: ${{ vars.RPC_URL_BASE_FORK }}
          RAINIX_RPC_SECRET_BASE_SEPOLIA: ${{ (env.RAINIX_PAID_FORK_RPC == 'true' || contains(env.RAINIX_PAID_FORK_RPC_NETWORKS, ' base_sepolia ')) && secrets.RPC_URL_BASE_SEPOLIA_FORK || '' }}
          RAINIX_RPC_VARS_BASE_SEPOLIA: ${{ vars.RPC_URL_BASE_SEPOLIA_FORK }}
          RAINIX_RPC_SECRET_ETHEREUM: ${{ (env.RAINIX_PAID_FORK_RPC == 'true' || contains(env.RAINIX_PAID_FORK_RPC_NETWORKS, ' ethereum ')) && secrets.RPC_URL_ETHEREUM_FORK || '' }}
          RAINIX_RPC_VARS_ETHEREUM: ${{ vars.RPC_URL_ETHEREUM_FORK }}
          RAINIX_RPC_SECRET_FLARE: ${{ (env.RAINIX_PAID_FORK_RPC == 'true' || contains(env.RAINIX_PAID_FORK_RPC_NETWORKS, ' flare ')) && secrets.RPC_URL_FLARE_FORK || '' }}
          RAINIX_RPC_VARS_FLARE: ${{ vars.RPC_URL_FLARE_FORK }}
          RAINIX_RPC_SECRET_HYPEREVM: ${{ (env.RAINIX_PAID_FORK_RPC == 'true' || contains(env.RAINIX_PAID_FORK_RPC_NETWORKS, ' hyperevm ')) && secrets.RPC_URL_HYPEREVM_FORK || '' }}
          RAINIX_RPC_VARS_HYPEREVM: ${{ vars.RPC_URL_HYPEREVM_FORK }}
          RAINIX_RPC_SECRET_POLYGON: ${{ (env.RAINIX_PAID_FORK_RPC == 'true' || contains(env.RAINIX_PAID_FORK_RPC_NETWORKS, ' polygon ')) && secrets.RPC_URL_POLYGON_FORK || '' }}
          RAINIX_RPC_VARS_POLYGON: ${{ vars.RPC_URL_POLYGON_FORK }}
          RAINIX_RPC_SECRET_ROBINHOOD: ${{ (env.RAINIX_PAID_FORK_RPC == 'true' || contains(env.RAINIX_PAID_FORK_RPC_NETWORKS, ' robinhood ')) && secrets.RPC_URL_ROBINHOOD_FORK || '' }}
          RAINIX_RPC_VARS_ROBINHOOD: ${{ vars.RPC_URL_ROBINHOOD_FORK }}
          RAINIX_RPC_SECRET_BSC: ${{ (env.RAINIX_PAID_FORK_RPC == 'true' || contains(env.RAINIX_PAID_FORK_RPC_NETWORKS, ' bsc ')) && secrets.RPC_URL_BSC_FORK || '' }}
          RAINIX_RPC_VARS_BSC: ${{ vars.RPC_URL_BSC_FORK }}
          RAINIX_RPC_SECRET_SEPOLIA: ${{ (env.RAINIX_PAID_FORK_RPC == 'true' || contains(env.RAINIX_PAID_FORK_RPC_NETWORKS, ' sepolia ')) && secrets.RPC_URL_SEPOLIA_FORK || '' }}
          RAINIX_RPC_VARS_SEPOLIA: ${{ vars.RPC_URL_SEPOLIA_FORK }}
      - name: Fork tests
        id: fork-test
        if: steps.preflight.outcome == 'success'
        continue-on-error: ${{ env.RAINIX_PUBLIC_RETRY == 'true' }}
        run: nix develop github:rainlanguage/rainix/${{ env.RAINIX_SHA }}#sol-shell -c forge test -vvv
      - name: RPC preflight (paid retry)
        if: env.RAINIX_PUBLIC_RETRY == 'true' && github.event_name != 'pull_request_target' && (steps.preflight.outcome == 'failure' || steps.fork-test.outcome == 'failure')
        uses: rainlanguage/rainix/.github/actions/rpc-preflight@main
        env:
          RAINIX_RPC_SECRET_ARBITRUM: ${{ secrets.RPC_URL_ARBITRUM_FORK }}
          RAINIX_RPC_VARS_ARBITRUM: ${{ vars.RPC_URL_ARBITRUM_FORK }}
          RAINIX_RPC_SECRET_BASE: ${{ secrets.RPC_URL_BASE_FORK }}
          RAINIX_RPC_VARS_BASE: ${{ vars.RPC_URL_BASE_FORK }}
          RAINIX_RPC_SECRET_BASE_SEPOLIA: ${{ secrets.RPC_URL_BASE_SEPOLIA_FORK }}
          RAINIX_RPC_VARS_BASE_SEPOLIA: ${{ vars.RPC_URL_BASE_SEPOLIA_FORK }}
          RAINIX_RPC_SECRET_ETHEREUM: ${{ secrets.RPC_URL_ETHEREUM_FORK }}
          RAINIX_RPC_VARS_ETHEREUM: ${{ vars.RPC_URL_ETHEREUM_FORK }}
          RAINIX_RPC_SECRET_FLARE: ${{ secrets.RPC_URL_FLARE_FORK }}
          RAINIX_RPC_VARS_FLARE: ${{ vars.RPC_URL_FLARE_FORK }}
          RAINIX_RPC_SECRET_HYPEREVM: ${{ secrets.RPC_URL_HYPEREVM_FORK }}
          RAINIX_RPC_VARS_HYPEREVM: ${{ vars.RPC_URL_HYPEREVM_FORK }}
          RAINIX_RPC_SECRET_POLYGON: ${{ secrets.RPC_URL_POLYGON_FORK }}
          RAINIX_RPC_VARS_POLYGON: ${{ vars.RPC_URL_POLYGON_FORK }}
          RAINIX_RPC_SECRET_ROBINHOOD: ${{ secrets.RPC_URL_ROBINHOOD_FORK }}
          RAINIX_RPC_VARS_ROBINHOOD: ${{ vars.RPC_URL_ROBINHOOD_FORK }}
          RAINIX_RPC_SECRET_BSC: ${{ secrets.RPC_URL_BSC_FORK }}
          RAINIX_RPC_VARS_BSC: ${{ vars.RPC_URL_BSC_FORK }}
          RAINIX_RPC_SECRET_SEPOLIA: ${{ secrets.RPC_URL_SEPOLIA_FORK }}
          RAINIX_RPC_VARS_SEPOLIA: ${{ vars.RPC_URL_SEPOLIA_FORK }}
      - name: Fork tests (paid retry)
        if: env.RAINIX_PUBLIC_RETRY == 'true' && github.event_name != 'pull_request_target' && (steps.preflight.outcome == 'failure' || steps.fork-test.outcome == 'failure')
        run: nix develop github:rainlanguage/rainix/${{ env.RAINIX_SHA }}#sol-shell -c forge test -vvv
