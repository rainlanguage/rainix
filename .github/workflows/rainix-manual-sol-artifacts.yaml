name: rainix-manual-sol-artifacts
on:
  workflow_call:
    inputs:
      suite:
        type: string
        required: true
        description: |
          Passed through as `DEPLOYMENT_SUITE`. The deploy script dispatches on
          this to select what to deploy.
      script:
        type: string
        required: false
        default: script/Deploy.sol:Deploy
        description: |
          Fully qualified forge script target (`path:Contract`) to run. Defaults
          to the conventional `script/Deploy.sol:Deploy`. Override to run an
          alternate deploy script in the same repo.
      network:
        type: string
        required: false
        default: ''
        description: |
          Passed through as `DEPLOYMENT_NETWORK`. Deploy scripts that support
          multiple bootstrap networks dispatch on this to select which network
          to broadcast to; scripts that ignore it keep their own default.
      legacy:
        type: boolean
        required: false
        default: false
        description: |
          Whether to pass `--legacy` to `forge script`. Required on networks
          whose RPCs reject the fee-history ranges EIP-1559 estimation uses
          (e.g. HyperEVM); type-0 transactions work everywhere.
      verify:
        type: boolean
        required: false
        default: true
        description: |
          Whether to pass `--verify` to `forge script`. Disable when deploying
          bytecode that does not match the current source (e.g. a pinned
          historical release deployed from stored creation code), where Etherscan
          verification against current source would fail the run.
    # Secrets consumed by the deploy step. Declared here so callers in a
    # different organization can pass them explicitly — `secrets: inherit`
    # only forwards a caller's secrets within the same org, so a cross-org
    # caller cannot reach them otherwise. All optional: an unset secret falls
    # back to the `|| vars.* || ''` chain in the job `env`. Mirrors the
    # declaration in `rainix-sol.yaml`.
    secrets:
      PRIVATE_KEY:
        required: false
      CACHIX_AUTH_TOKEN:
        required: false
      EXPLORER_VERIFICATION_KEY:
        required: false
      RPC_URL_ARBITRUM_FORK:
        required: false
      RPC_URL_BASE_FORK:
        required: false
      RPC_URL_BASE_SEPOLIA_FORK:
        required: false
      RPC_URL_ETHEREUM_FORK:
        required: false
      RPC_URL_FLARE_FORK:
        required: false
      RPC_URL_HYPEREVM_FORK:
        required: false
      RPC_URL_POLYGON_FORK:
        required: false
      CI_DEPLOY_ARBITRUM_ETHERSCAN_API_KEY:
        required: false
      CI_DEPLOY_BASE_ETHERSCAN_API_KEY:
        required: false
      CI_DEPLOY_BASE_SEPOLIA_ETHERSCAN_API_KEY:
        required: false
      CI_DEPLOY_ETHEREUM_ETHERSCAN_API_KEY:
        required: false
      CI_DEPLOY_POLYGON_ETHERSCAN_API_KEY:
        required: false
      CI_DEPLOY_FLARE_ETHERSCAN_API_KEY:
        required: false
env:
  RAINIX_SHA: 53e96a7d0a97d7c7c75c3b2412521324776fdac6
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Shared nix + cachix CI preamble (checkout, nix-quick-install, Cachix,
      # cache-nix-action) — pinned action SHAs live in the composite. Fully
      # qualified ref: a bare `./` would resolve against the calling repo.
      - uses: rainlanguage/rainix/.github/actions/nix-cachix-setup@main
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Cache Foundry's incremental compilation cache + artifacts so unchanged
      # contracts aren't recompiled (forge build is the dominant CI cost).
      - name: Cache Foundry build
        uses: rainlanguage/rainix/.github/actions/cache@main
        with:
          path: |
            cache
            out
          key: foundry-full-${{ runner.os }}-${{ hashFiles('src/**/*.sol', 'test/**/*.sol', 'script/**/*.sol', 'foundry.toml', 'soldeer.lock', 'remappings.txt') }}
          restore-keys: |
            foundry-full-${{ runner.os }}-
      - name: Install soldeer dependencies
        if: hashFiles('soldeer.lock') != ''
        run: nix develop github:rainlanguage/rainix/${{ env.RAINIX_SHA }}#sol-shell -c forge soldeer install
      - run: nix develop github:rainlanguage/rainix/${{ env.RAINIX_SHA }}#sol-shell -c forge selectors up --all
      # archive: false — this is a broadcast, so it only ever reads head state.
      # Requiring historical state here would reject a perfectly good pruning
      # endpoint; the RPC_URL_<NET>_FORK name is a misnomer on this path.
      # Candidate URLs travel as env, never as `with:` inputs, because GitHub
      # renders a composite's resolved inputs into the log.
      - name: RPC preflight
        uses: rainlanguage/rainix/.github/actions/rpc-preflight@main
        with:
          archive: 'false'
        env:
          RAINIX_RPC_SECRET_ARBITRUM: ${{ secrets.RPC_URL_ARBITRUM_FORK }}
          RAINIX_RPC_VARS_ARBITRUM: ${{ vars.RPC_URL_ARBITRUM_FORK }}
          RAINIX_RPC_SECRET_BASE: ${{ secrets.RPC_URL_BASE_FORK }}
          RAINIX_RPC_VARS_BASE: ${{ vars.RPC_URL_BASE_FORK }}
          RAINIX_RPC_SECRET_BASE_SEPOLIA: ${{ secrets.RPC_URL_BASE_SEPOLIA_FORK }}
          RAINIX_RPC_VARS_BASE_SEPOLIA: ${{ vars.RPC_URL_BASE_SEPOLIA_FORK }}
          RAINIX_RPC_SECRET_ETHEREUM: ${{ secrets.RPC_URL_ETHEREUM_FORK }}
          RAINIX_RPC_VARS_ETHEREUM: ${{ vars.RPC_URL_ETHEREUM_FORK }}
          RAINIX_RPC_SECRET_FLARE: ${{ secrets.RPC_URL_FLARE_FORK }}
          RAINIX_RPC_VARS_FLARE: ${{ vars.RPC_URL_FLARE_FORK }}
          RAINIX_RPC_SECRET_HYPEREVM: ${{ secrets.RPC_URL_HYPEREVM_FORK }}
          RAINIX_RPC_VARS_HYPEREVM: ${{ vars.RPC_URL_HYPEREVM_FORK }}
          RAINIX_RPC_SECRET_POLYGON: ${{ secrets.RPC_URL_POLYGON_FORK }}
          RAINIX_RPC_VARS_POLYGON: ${{ vars.RPC_URL_POLYGON_FORK }}
      - run: nix develop github:rainlanguage/rainix/${{ env.RAINIX_SHA }}#sol-shell -c forge script ${{ inputs.script }} -vvvvv --slow --broadcast ${{ inputs.verify && '--verify' || '' }} ${{ inputs.legacy && '--legacy' || '' }}
        # <NETWORK>_RPC_URL is bound by the rpc-preflight step above, which picks
        # a candidate that is reachable right now rather than binding one URL
        # that may be dead.
        env:
          DEPLOYMENT_SUITE: ${{ inputs.suite }}
          DEPLOYMENT_NETWORK: ${{ inputs.network }}
          DEPLOYMENT_KEY: ${{ secrets.PRIVATE_KEY }}
          # Etherscan V2 is a single multichain API key: source all Etherscan-family
          # networks from the one EXPLORER_VERIFICATION_KEY secret (legacy per-chain
          # secret kept as fallback during migration). Flare/Songbird are NOT
          # Etherscan (Routescan/Blockscout) so keep a chain-specific key.
          CI_DEPLOY_ARBITRUM_ETHERSCAN_API_KEY: ${{ secrets.EXPLORER_VERIFICATION_KEY || secrets.CI_DEPLOY_ARBITRUM_ETHERSCAN_API_KEY || vars.CI_DEPLOY_ARBITRUM_ETHERSCAN_API_KEY || '' }}
          CI_DEPLOY_BASE_ETHERSCAN_API_KEY: ${{ secrets.EXPLORER_VERIFICATION_KEY || secrets.CI_DEPLOY_BASE_ETHERSCAN_API_KEY || vars.CI_DEPLOY_BASE_ETHERSCAN_API_KEY || '' }}
          CI_DEPLOY_BASE_SEPOLIA_ETHERSCAN_API_KEY: ${{ secrets.EXPLORER_VERIFICATION_KEY || secrets.CI_DEPLOY_BASE_SEPOLIA_ETHERSCAN_API_KEY || vars.CI_DEPLOY_BASE_SEPOLIA_ETHERSCAN_API_KEY || '' }}
          CI_DEPLOY_ETHEREUM_ETHERSCAN_API_KEY: ${{ secrets.EXPLORER_VERIFICATION_KEY || secrets.CI_DEPLOY_ETHEREUM_ETHERSCAN_API_KEY || vars.CI_DEPLOY_ETHEREUM_ETHERSCAN_API_KEY || '' }}
          CI_DEPLOY_POLYGON_ETHERSCAN_API_KEY: ${{ secrets.EXPLORER_VERIFICATION_KEY || secrets.CI_DEPLOY_POLYGON_ETHERSCAN_API_KEY || vars.CI_DEPLOY_POLYGON_ETHERSCAN_API_KEY || '' }}
          CI_DEPLOY_FLARE_ETHERSCAN_API_KEY: ${{ secrets.CI_DEPLOY_FLARE_ETHERSCAN_API_KEY || vars.CI_DEPLOY_FLARE_ETHERSCAN_API_KEY || '' }}
