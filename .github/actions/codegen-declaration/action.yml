name: codegen-declaration
description: >-
  Fails `rainix-copy-artifacts` when a codegen hook declared a generated path that was then not written. Re-running the generators and diffing proves the committed CONTENT is current, but a generator that has STOPPED emitting a file writes nothing, so the already-correct committed copy is left alone, nothing differs and the job is green over a dead emitter (rainlanguage/rain.factory.deploy#35). Only the generator knows which paths it owns rather than deliberately leaves frozen, so it declares them on stdout as `rainix-codegen owns <path>`, teed into the log this reads. What was WRITTEN is observed, never declared: `mark` records every tracked file's mtime before the first hook and `verify` counts a moved mtime as a write. A repo whose hooks declare nothing is a no-op.
inputs:
  phase:
    description: >-
      `mark` before the first codegen hook, `verify` after the last one and before `forge fmt`, which rewrites sources of its own.
    required: true
runs:
  using: composite
  steps:
    - name: Codegen declaration
      shell: bash
      env:
        RAINIX_CODEGEN_PHASE: ${{ inputs.phase }}
      run: |
        set -euo pipefail
        # path: ref runs the check from THIS composite's own checkout, so the
        # check version always matches the action version (same pattern as
        # mutation-ledger) regardless of any RAINIX_SHA the caller pins.
        nix run "path:$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)#rainix-static" -- \
          codegen-declaration "$RAINIX_CODEGEN_PHASE" \
          --state "$RUNNER_TEMP/rainix-codegen-mtimes.json" \
          --log "$RUNNER_TEMP/rainix-codegen.log"
