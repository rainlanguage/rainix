name: comment-loc-cap
description: >-
  Fails when, summed over every tracked source file under the given paths, comment lines exceed twice the code lines. One aggregate cap, strict: at twice passes. Counting is `scc`'s, which lexes per language, so a comment marker inside a string literal is code and a doc comment is a comment. Counted extensions are .sol/.rs/.ts/.js, .sh/.toml/.yaml and .nix; anything else, prose formats included, is not counted at all — `scc` scores Markdown text as comments, so counting it would fail every repo that has a README. On failure the totals and every file's counts are printed. A path set that selects no counted file is an error, not a pass.
inputs:
  paths:
    description: >-
      Directories to scan, relative to the repo root, whitespace or comma separated. Only files `git ls-files` reports under them are read. `.github` is included by default because CI config is where prose accumulates unread, and the YAML there is counted the same as source.
    required: false
    default: src test .github
runs:
  using: composite
  steps:
    - name: Check comment-to-code line cap
      shell: bash
      env:
        # Via env, not interpolated into the script: caller input is never
        # pasted into the shell text.
        RAINIX_COMMENT_LOC_PATHS: ${{ inputs.paths }}
      run: |
        set -euo pipefail
        # Single source of truth: the Rust rainix-static binary (its unit tests
        # run inside the nix build). The path: flake ref runs it from this
        # composite's own checkout, so the check version always matches the
        # action version regardless of any RAINIX_SHA the caller pins.
        nix run "path:$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)#rainix-static" -- \
          comment-loc-cap --paths "$RAINIX_COMMENT_LOC_PATHS"
