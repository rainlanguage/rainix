name: frozen-snapshots-append-only
description: >-
  Fails when a branch modifies or deletes an existing per-tag deploy-pin snapshot under src/generated/<tag>/ (tag = three underscore-separated numbers, e.g. 0_1_4). These snapshots are frozen once on the base branch — downstream consumers pin the address/codehash constants they hold, so a release ADDS a new tag (bump the version), never edits an existing snapshot. No-op for a repo that carries no src/generated/ record at all.
runs:
  using: composite
  steps:
    - name: Enforce append-only snapshots
      shell: bash
      run: |
        set -euo pipefail
        # Nothing to enforce if the repo carries no generated record at all — a
        # library repo, which has no per-tag deploy-pin snapshots.
        #
        # A presence test on ONE directory, deliberately. Asserting a filename
        # inside the record instead would make the gate skip wherever the
        # generator's naming differs from the assertion, which is silent: a skip
        # and a pass are the same green. Which entries under the root are
        # releases is the Rust check's call, via the same `is_tag` the release
        # guard uses; bash only decides whether there is a record to look at.
        #
        # A branch that deletes the ENTIRE src/generated/ tree still skips here,
        # because the test reads the HEAD tree — so removing every snapshot
        # switches off the check that would catch the removal. Distinguishing
        # that from a repo that never had a record needs the BASE branch, which
        # is what the fetch below exists to get, so closing it would mean
        # fetching in every sol repo in the org, including the ones whose
        # default branch is not `main`. Left as is, narrowly: deleting one
        # frozen snapshot, or the tag dir holding it, is caught.
        if [ ! -d src/generated ]; then
          echo "snapshots-append-only: no generated record; skip"
          exit 0
        fi
        # The three-dot diff needs the merge-base with the base branch, but the
        # shared checkout is shallow — unshallow (rain repos are small, so cheap)
        # and fetch the base. GITHUB_BASE_REF is set on pull_request; on push it
        # is empty, so compare against main.
        BASE_REF="${GITHUB_BASE_REF:-main}"
        if [ -f "$(git rev-parse --git-dir)/shallow" ]; then
          git fetch --no-tags --unshallow origin
        fi
        git fetch --no-tags origin "$BASE_REF"
        # path: ref runs the check from THIS composite's own checkout, so the
        # check version always matches the action version (same pattern as
        # no-submodules) regardless of any RAINIX_SHA the caller pins.
        nix run "path:$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)#rainix-static" -- \
          snapshots-append-only --base "origin/$BASE_REF"
