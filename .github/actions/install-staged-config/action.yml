name: install-staged-config
description: >-
  Installs what `forge script ./script/Build.sol` staged in `.staged-config/` onto the root files of the same names, then removes the dir. Foundry refuses a cheatcode write to the root `foundry.toml`, so a deploy repo's generated config reaches the root only through here. Fails when nothing was staged but `foundry.toml` carries `# rain-deploy:generated:` blocks, and when the dir is empty. A repo that stages nothing and has no such blocks is a no-op.
runs:
  using: composite
  steps:
    - name: Install staged config
      shell: bash
      run: |
        set -euo pipefail
        nix run "path:$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)#rainix-static" -- install-staged-config
